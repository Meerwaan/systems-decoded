<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Système Décodé · HS01 · Ton pare-brise</title>
    <link rel="stylesheet" href="gen/brand.css" />
    <script src="gen/gsap.min.js"></script>
    <style>
      /* Les dispositifs récurrents (en-tête, cartes d'accroche, sous-titres, #film) sont stylés dans kit/brand.css.
         Ici : ce qui n'existe que dans ce hors-série. */

      /* le noir : celui d'avant l'impact de la tête (acte3.js) et celui du gag (« Alors… on l'ouvre. » → noir →
         « Pas ici. », fin.js). Sous l'en-tête, qui reste seul allumé. Opacité 0 ou 1, jamais entre les deux. */
      #black { background: #000; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="64.7" data-width="1080" data-height="1920">
      <canvas id="stage" width="1080" height="1920"></canvas>
      <div id="vignette" class="layer"></div>
      <div id="black" class="layer"></div>
      <div id="hud-shade"></div>
      <div id="title-shade"></div>
      <svg id="leaders" viewBox="0 0 1080 1920"></svg>

      <header id="hud">
        <div class="hud__tag"><i class="hud__dot"></i><span>Hors-série 01</span></div>
        <div class="hud__title" id="hud-title">Ton pare-brise</div>
        <div class="hud__clock" id="hud-clock">FILM · 00:00</div>
        <div class="hud__count" id="hud-count"><span id="hud-count-l">Fils ouverts</span><b id="hud-count-v">0</b></div>
        <div class="hud__rule"></div>
        <nav class="hud__acts">
          <span>01 Menace</span><span>02 L'usine</span><span>03 Rendez-vous</span>
          <em class="hud__brand">Système Décodé</em>
        </nav>
      </header>

      <!-- hors-série (filmCall) : le L01, vers lequel la promo envoie -->
      <section id="film">
        <div class="panel__h"><span>Film complet</span><span id="film-length">8 min 51</span></div>
        <div id="film-title">Ton pare-brise</div>
        <div id="film-bar"><i></i></div>
        <div id="film-where"><span>Sur YouTube</span><span>Lien en bio</span></div>
      </section>

      <div id="callouts" class="layer"></div>
      <div id="hook"></div>
      <div id="captions"></div>
      <div id="flash" class="layer"></div>

      <!-- AUDIO:START (généré par scripts/build.mjs — ne pas éditer à la main) -->
      <audio id="vo" src="audio/voix.wav" data-start="0" data-track-index="10" data-volume="1"></audio>
      <audio id="bed" src="audio/bed.wav" data-start="0" data-track-index="12" data-volume="0.8"></audio>
      <!-- AUDIO:END -->
    </div>

    <script src="gen/episode.data.js"></script>
    <script src="gen/bundle.js"></script>
    <script>
      const tl = window.SD.build();
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
