<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Système Décodé · __ID__ · __TITLE__</title>
    <link rel="stylesheet" href="gen/brand.css" />
    <script src="gen/gsap.min.js"></script>
    <style>
      /* Les dispositifs récurrents (dont #reveal) sont stylés dans kit/brand.css. Ici : ce qui n'existe que dans cet épisode. */
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="60" data-width="1080" data-height="1920">
      <canvas id="stage" width="1080" height="1920"></canvas>
      <div id="vignette" class="layer"></div>
      <svg id="leaders" viewBox="0 0 1080 1920"></svg>

      <header id="hud">
        <div class="hud__tag"><i class="hud__dot"></i><span>Dossier __ID__</span></div>
        <div class="hud__title" id="hud-title">__TITLE__</div>
        <div class="hud__clock" id="hud-clock">00:00:00</div>
        <div class="hud__rule"></div>
        <nav class="hud__acts">
          <span>01 Menace</span><span>02 Autopsie</span><span>03 Réponse</span>
          <em class="hud__brand">Système Décodé</em>
        </nav>
      </header>

      <div id="reveal">
        <div class="kicker">Le secret</div>
        <div id="reveal-main">À écrire</div>
      </div>

      <div id="callouts" class="layer"></div>
      <div id="hook"></div>
      <div id="captions"></div>
      <div id="flash" class="layer"></div>

      <!-- AUDIO:START (généré par scripts/build.mjs — ne pas éditer à la main) -->
      <!-- AUDIO:END -->
    </div>

    <script src="gen/episode.data.js"></script>
    <script src="gen/bundle.js"></script>
    <script>
      const tl = window.SD.build();
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
