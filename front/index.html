<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070a0c" />
    <meta name="color-scheme" content="dark" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bureau" />
    <title>Bureau · Système Décodé</title>
    <link rel="icon" href="/brand/avatar.png" />
    <link rel="apple-touch-icon" href="/brand/avatar.png" />
    <link rel="preload" href="/fonts/barlow-condensed-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/barlow-condensed-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/bureau.css" />
    <script src="/bureau.js" defer></script>
  </head>
  <body data-tab="publier">
    <header class="top">
      <div class="top__in">
        <a class="brand" href="#publier" data-tab-link="publier" aria-label="Bureau, retour à Publier">
          <img src="/brand/avatar.png" alt="" width="28" height="28" />
          <span class="brand__name" id="brand">Système Décodé</span>
        </a>
        <nav class="tabs tabs--top" aria-label="Sections">
          <a href="#publier" data-tab-link="publier" title="Publier (1)"><i class="ico" data-ico="send"></i><span>Publier</span><b data-count="publier"></b></a>
          <a href="#calendrier" data-tab-link="calendrier" title="Calendrier (2)"><i class="ico" data-ico="calendar"></i><span>Calendrier</span><b data-count="calendrier"></b></a>
          <a href="#chiffres" data-tab-link="chiffres" title="Chiffres (3)"><i class="ico" data-ico="chart"></i><span>Chiffres</span></a>
          <a href="#films" data-tab-link="films" title="Films (4)"><i class="ico" data-ico="grid"></i><span>Films</span></a>
        </nav>
        <p class="keys" aria-hidden="true"><kbd>1</kbd>–<kbd>4</kbd> onglets · <kbd>/</kbd> chercher · <kbd>R</kbd> relire · <kbd>Échap</kbd> fermer</p>
        <button class="sync" id="sync" type="button" title="Relire le PC maintenant (R) · raccourcis : 1 à 4 onglets, / chercher, Échap fermer">
          <i class="sync__dot"></i><span class="sync__t" id="sync-t">…</span>
        </button>
      </div>
    </header>

    <p class="banner" id="banner" role="status" hidden></p>

    <main id="main">
      <section class="view" id="publier" aria-labelledby="h-publier"></section>
      <section class="view" id="calendrier" aria-labelledby="h-calendrier"></section>
      <section class="view" id="chiffres" aria-labelledby="h-chiffres"></section>
      <section class="view" id="films" aria-labelledby="h-films"></section>
    </main>

    <nav class="tabs tabs--bottom" aria-label="Sections">
      <a href="#publier" data-tab-link="publier"><i class="ico" data-ico="send"></i><span>Publier</span><b data-count="publier"></b></a>
      <a href="#calendrier" data-tab-link="calendrier"><i class="ico" data-ico="calendar"></i><span>Calendrier</span><b data-count="calendrier"></b></a>
      <a href="#chiffres" data-tab-link="chiffres"><i class="ico" data-ico="chart"></i><span>Chiffres</span></a>
      <a href="#films" data-tab-link="films"><i class="ico" data-ico="grid"></i><span>Films</span></a>
    </nav>

    <!-- la fiche d'un film, ouverte depuis n'importe quel onglet sans le quitter -->
    <dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
      <div class="sheet__panel" id="sheet-panel">
        <div class="sheet__grab" id="sheet-grab" aria-hidden="true"><i></i></div>
        <header class="sheet__head">
          <div class="sheet__titles">
            <p class="kicker" id="sheet-kicker"></p>
            <h2 class="sheet__title" id="sheet-title"></h2>
          </div>
          <button class="iconbtn" type="button" data-close-sheet aria-label="Fermer la fiche"></button>
        </header>
        <div class="sheet__body" id="sheet-body"></div>
      </div>
    </dialog>

    <dialog class="viewer" id="viewer" aria-label="Lecture">
      <div class="viewer__bar">
        <span id="viewer-tag"></span>
        <button class="iconbtn" type="button" data-close aria-label="Fermer"></button>
      </div>
      <div class="viewer__stage" id="viewer-stage"></div>
      <p class="viewer__hint" id="viewer-hint"></p>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden>
      <span id="toast-t"></span>
      <button type="button" id="toast-act" hidden></button>
    </div>
    <noscript><p class="banner">Cette page a besoin de JavaScript.</p></noscript>
  </body>
</html>
